name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --lib --bins --all-features

  black-box:
    name: Black-box end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install supported agent CLIs
        run: npm install --global @openai/codex@0.104.0 opencode-ai@1.18.28 @earendil-works/pi-coding-agent@0.85.0
      - run: cargo build --locked --all-features --bins
      - run: cargo test --locked --test black_box --all-features -- --test-threads=1
        env:
          KAIION_TEST_BINARY: ${{ github.workspace }}/target/debug/kaiion
          KAIION_TEST_REAL_CLIS: "1"
